[package]
name = "lexi-core"
version = "0.1.0"
edition = "2021"
description = "Core logic, normalization, hybrid dictionary/LLM lookup, and Handy bridge for Lexi"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
tiny_http = "0.12"
ureq = { version = "2.9", features = ["json", "tls"] }
log = "0.4"
thiserror = "1.0"
regex = "1.10"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
