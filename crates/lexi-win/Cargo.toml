[package]
name = "lexi-win"
version = "0.1.0"
edition = "2021"
description = "Native Windows background daemon, topmost transparent overlay, and system tray for Lexi"

[dependencies]
lexi-core = { path = "../lexi-core" }
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
] }
