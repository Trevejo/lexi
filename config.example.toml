[stt]
# Lexi é 100% autossuficiente e captura áudio do microfone diretamente (sem precisar de softwares externos!)
enabled = true

# Modelo Speech-to-Text selecionado:
# - "whisper-base": Whisper Base GGML (148 MB - Recomendado, ótimo balanço de velocidade e precisão)
# - "whisper-tiny": Whisper Tiny GGML (75 MB - Super leve, ideal para PCs modestos)
# - "whisper-small": Whisper Small GGML (488 MB - Alta precisão multilíngue)
# - "nemotron-3.5": Nemotron 3.5 Streaming (717 MB - Rápido para streaming de jogos)
# - "parakeet-0.6b": Parakeet Unified EN (698 MB - Excelente para inglês gamer)
# - "canary-180m": Canary 180M (740 MB - Multilíngue de alta fidelidade)
selected_model = "whisper-base"

# Modo de ativação do microfone:
# - "push_to_talk": Grava apenas enquanto você mantiver a tecla pressionada (Push-to-Talk)
# - "toggle": Primeiro toque inicia a gravação, segundo toque finaliza
activation_mode = "push_to_talk"

# Tecla de ativação de voz (ex: "F9", "F8", "CapsLock", "F13", "XButton1")
hotkey = "F9"

# Dispositivo de entrada de áudio (deixe em branco para usar o microfone padrão do Windows)
# input_device = "Microphone (Realtek Audio)"

# Idioma do reconhecimento ("auto", "en", "pt")
language = "auto"

[onboarding]
# Indica se o assistente de boas-vindas do primeiro uso já foi concluído
completed = false

[lookup]
# Modo de consulta de significados:
# - "hybrid": Consulta primeiro o cache e o dicionário offline. Se não encontrar
#             (ou for gíria complexa / expressão), consulta a IA automaticamente.
# - "offline_only": Consulta apenas a base SQLite offline local (0ms de latência e sem internet).
# - "llm_only": Consulta sempre a IA para qualquer termo.
mode = "hybrid"

# Caminhos dos bancos de dados SQLite (criados automaticamente se não existirem)
dictionary_path = "dictionary.sqlite"
cache_path = "cache.sqlite"

[llm]
# Configurações do modelo de Inteligência Artificial para tradução, gírias e clarificação de voz
enabled = true

# Provedor de IA:
# - "gemini": Google Gemini (Rápido, gratuito ou pago via API key do Google AI Studio)
# - "claude": Anthropic Claude (Excelente raciocínio e nuance de tradução)
# - "openai": OpenAI GPT (GPT-4o, GPT-4o-mini)
# - "opencode": OpenCode / Local AI (servidor local em http://127.0.0.1:8317/v1 ou Ollama)
# - "custom": Qualquer servidor compatível com a API OpenAI (Groq, Together, vLLM, etc.)
provider = "gemini"

# URL base da API:
# - Gemini: "https://generativelanguage.googleapis.com/v1beta/openai"
# - Claude: "https://api.anthropic.com/v1"
# - OpenAI: "https://api.openai.com/v1"
# - OpenCode: "http://127.0.0.1:8317/v1"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"

# Sua chave de API (deixe em branco se usar OpenCode/Ollama local)
api_key = ""

# Modelo a utilizar:
# - Gemini: "gemini-1.5-flash" ou "gemini-1.5-pro"
# - Claude: "claude-3-5-sonnet-20241022" ou "claude-3-haiku-20240307"
# - OpenAI: "gpt-4o-mini" ou "gpt-4o"
model = "gemini-1.5-flash"

# Tempo limite máximo de espera da resposta da IA (em segundos)
timeout_seconds = 5

# Ativa o filtro inteligente de fala (remove gaguejos, ruído e conserta fonética de termos gamer)
voice_clarification = true

# Adiciona insights de mecânica, estratégia e contexto gamer na tradução
gamer_insights = true

[dismiss]
# Como o card do overlay é dispensado da tela:
# - "release_key": Fecha assim que você soltar a tecla de fala (Push-to-Talk)
# - "timeout": Fecha automaticamente após o tempo limite definido em 'timeout_seconds'
# - "hotkey": Fecha somente quando você pressionar a tecla de fechar ('dismiss_hotkey')
# - "any_key": Fecha assim que você apertar qualquer tecla (sem roubar a ação do jogo)
# - "hybrid": Fecha se você soltar a tecla, se der o tempo limite ou se apertar Esc
mode = "hybrid"

# Tempo de exibição antes do fechamento automático (em segundos)
timeout_seconds = 8.0

# Tecla rápida para fechar o card manualmente a qualquer momento
dismiss_hotkey = "Escape"

# Tecla a ser observada para o modo 'release_key'
trigger_key_to_watch = "F9"

[overlay]
# Exibir o card visual sobre o jogo
enabled = true

# Posição na tela do monitor ativo:
# - "top_center": Topo centralizado (recomendado, longe das legendas e mira)
# - "middle_left": Centro-esquerda da tela
# - "middle_right": Centro-direita da tela
# - "top_right": Canto superior direito
# - "top_left": Canto superior esquerdo
# - "center": Centro da tela
# - "bottom_center": Parte inferior centralizada
position = "top_center"

# Fator de Escala / Zoom da interface:
# - 1.0: 100% (Padrão 1080p)
# - 1.25: 125% (Ideal para 1440p)
# - 1.5: 150% (Ideal para monitores 4K com zoom do Windows)
# - 1.75: 175%
# - 2.0: 200%
scale = 1.5

# Dimensões base da janela em pixels
width = 440
max_height = 240

# Tipografia e estilo
font_family = "Segoe UI"
font_size = 15
opacity = 0.94 # Transparência do fundo escuro (0.0 a 1.0)
fade_duration_ms = 120

[audio]
# Leitura em voz alta via sintetizador nativo do Windows (TTS):
# Essencial para jogos em TELA CHEIA EXCLUSIVA onde o overlay visual não pode sobrepor o jogo
enabled = false

# Se ativado como 'true', só falará no áudio caso o jogo esteja em tela cheia exclusiva
only_fullscreen = false

# Voz padrão em Português do Brasil (utiliza as vozes SAPI instaladas no Windows)
voice = "pt-BR"

# Volume de 0 a 100
volume = 85

# Velocidade da fala (-10 a 10, sendo 0 o padrão e 1 levemente mais ágil)
rate = 1

[bridge]
# Porta opcional legada para integração de terceiros (Handy / OBS / bots)
host = "127.0.0.1"
port = 47823
model_name = "lexi"
